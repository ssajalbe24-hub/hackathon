const nonveg=q=>q[0]||q[1],fit=q=>S.diet==='veg'?!nonveg(q):S.diet==='jain'?!nonveg(q)&&q[4]:1;
const dist=(a,b,c,d)=>{const k=x=>x*Math.PI/180,h=Math.sin(k(c-a)/2)**2+Math.cos(k(a))*Math.cos(k(c))*Math.sin(k(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
function summary(q){if(nonveg(q))return t('Not vegetarian as served')+' ('+[q[0]&&t('fish stock'),q[1]&&t('meat / animal fat')].filter(Boolean).join(S.lang==='hi'?' और ':' and ')+').';
 return t('Vegetarian as served.')+(q[3]?' '+t('Shared fryer or grill may touch meat or fish.'):'')+(q[2]?' '+t('Cooked with alcohol.'):'')+(q[4]?' '+t('Made without onion or garlic.'):'')}
const tag=q=>nonveg(q)?`<span class="tag n">${t('Non-veg')}</span>`:q[4]&&!q[3]?`<span class="tag j">${t('Jain-friendly')}</span>`:`<span class="tag v">${t('Veg')}</span>`;
function toast(m){$('#toast').innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>$('#toast').innerHTML='',2000)}
function go(p){S.page=p;S.sel=null;render();$('#scr').scrollTop=0}
const lang=()=>`<div class="lang"><button class="${S.lang==='en'?'on':''}" onclick="S.lang='en';render()">EN</button><button class="${S.lang==='hi'?'on':''}" onclick="S.lang='hi';render()">हिं</button></div>`;
function near(){const q=S.q.toLowerCase(),m=S.mode==='delivery'?'dl':'di';
 return R.filter(r=>(S.cat==='All'||r.c.includes(S.cat))&&(!q||r.n.toLowerCase().includes(q)||r.c.toLowerCase().includes(q)||r.m.some(d=>d[0].toLowerCase().includes(q)))).map(r=>({...r,km:dist(S.pos.lat,S.pos.lng,r.lat,r.lng),ok:r[m],vn:r.m.filter(d=>fit(d[4])).length})).sort((a,b)=>b.ok-a.ok||a.km-b.km)}
const bdg=(l,y)=>`<span class="bd"><u class="${y?'y':'x'}">${y?'✓':'✕'}</u>${t(l)}</span>`;
function rcard(r){return`<div class="rc ${S.selR===r.id&&S.view==='map'?'sel':''}" tabindex="0" onclick="openR(${r.id})" onkeydown="if(event.key==='Enter')this.click()"><div class="pic">${rimg(r)}</div><div class="rb"><div class="row sp"><h3>${esc(r.n)}</h3><span class="star">${r.r}</span></div><div class="mu">${esc(r.c)}</div><div class="row" style="margin-top:6px"><span class="mu">📍 ${r.km.toFixed(1)} km</span>${bdg('Takeaway',r.dl)}${bdg('Dine in',r.di)}</div><div class="mu" style="margin-top:4px">${S.diet==='any'?r.m.filter(d=>!nonveg(d[4])).length+' '+(S.lang==='hi'?'शाकाहारी डिश':'vegetarian dishes'):r.vn+' '+(S.lang==='hi'?'डिश आपके आहार से मेल खाती हैं':'dishes match your diet')}</div></div></div>`}
function openR(id){S.rid=id;if(S.cart.rid!==id)S.cart={rid:id};S.tab='All';go('menu')}
const modeSeg=()=>`<div class="seg"><button class="${S.mode==='delivery'?'on':''}" onclick="S.mode='delivery';render()">${t('Online order')}</button><button class="${S.mode==='dine'?'on':''}" onclick="S.mode='dine';render()">${t('Dine in')}</button></div>`;
const dietChips=()=>`<div class="chips">${[['any','Anything'],['veg','Vegetarian'],['jain','Jain']].map(([k,l])=>`<button class="chip ${S.diet===k?'on':''}" onclick="S.diet='${k}';render()">${t(l)}</button>`).join('')}</div>`;

function login(){return`<div class="hero" style="min-height:330px"><div class="top"><span class="brand">Tabemasu<i>●</i></span>${lang()}</div><h1>${t('Eat where you can trust the label.')}</h1><p>${t('See what’s really in every dish, before you order.')}</p></div>
 <div class="pad"><div class="card"><h2 style="margin-bottom:4px">Sign in</h2><p class="mu" style="margin:0 0 6px">Phone number for orders, location to find restaurants near you.</p>
 <div class="f"><label for="ph">Phone number</label><div class="row" style="flex-wrap:nowrap"><select id="cc" style="width:92px"><option>+91</option><option>+81</option><option>+1</option><option>+44</option></select><input id="ph" type="tel" inputmode="numeric" placeholder="98765 43210"></div></div>
 <button onclick="start()" style="width:100%">📍 Allow location and continue</button><p class="mu" id="msg" style="margin:8px 0 0"></p></div></div>`}
function start(){const p=$('#ph').value.replace(/\D/g,'');if(p.length<7)return toast('Enter a valid phone number');$('#msg').textContent='Finding your location…';
 const d=()=>go('home');if(!navigator.geolocation)return d();
 locate(d)}
function locate(cb){if(!navigator.geolocation){toast('Location is not available on this device');return cb&&cb()}
 toast('Finding your exact location…');
 navigator.geolocation.getCurrentPosition(g=>{const c=g.coords;S.me={lat:c.latitude,lng:c.longitude,acc:Math.round(c.accuracy)};
  if(dist(c.latitude,c.longitude,35.6938,139.7034)>60){S.pos={lat:35.6938,lng:139.7034,real:0};toast('You’re outside Japan: showing Tokyo demo restaurants')}else S.pos={lat:c.latitude,lng:c.longitude,real:1};
  render();cb&&cb()},()=>{toast('Location blocked: showing Shinjuku, Tokyo');cb&&cb()},{enableHighAccuracy:true,timeout:8000,maximumAge:0})}

function home(){const rs=near().slice(0,3);
 return`<div class="hero"><div class="top"><span class="brand">Tabemasu<i>●</i></span>${lang()}</div><div class="mu" style="color:#ffd9a8;margin-top:12px">📍 ${S.me?S.me.lat.toFixed(4)+', '+S.me.lng.toFixed(4)+(S.pos.real?'':' · demo area: Shinjuku'):'Shinjuku, Tokyo (demo)'}</div><h1 style="margin-top:6px">${t('Eat where you can trust the label.')}</h1><p>${t('See what’s really in every dish, before you order.')}</p>
 <form class="search" onsubmit="event.preventDefault();S.q=$('#q').value;go('nearby')"><span>🔍</span><input id="q" placeholder="${t('Search restaurants or dishes')}" value="${esc(S.q)}"><button>Go</button></form></div>
 <div class="pad">${modeSeg()}<div class="sec" style="margin-top:16px"><h2>${t('My diet')}</h2></div>${dietChips()}
 <div class="sec"><h2>${t('Popular categories')}</h2></div><div class="cats">${CATS.map(([c,e])=>`<button class="cat ${S.cat===c?'on':''}" onclick="S.cat='${c}';go('nearby')"><span>${art(e)}</span>${t(c)}</button>`).join('')}</div>
 <div class="sec"><h2>${t('Best listed near you')}</h2><a onclick="go('nearby')">${t('All')} →</a></div>${rs.map(rcard).join('')}</div>`}
function nearby(){const rs=near();if(!S.selR||!rs.some(r=>r.id===S.selR))S.selR=rs[0]&&rs[0].id;
 return`<div class="stick"><div class="row sp" style="margin-bottom:8px"><h2>${t('Restaurants near you')}</h2>${lang().replace('rgba(255,255,255,.15)','x')}</div>
 <input placeholder="${t('Search restaurants or dishes')}" value="${esc(S.q)}" oninput="S.q=this.value;S.k=1;lst()" style="margin-bottom:8px">
 <div class="row sp" style="margin-bottom:8px;flex-wrap:nowrap"><div style="flex:1">${modeSeg()}</div><div class="seg" style="width:128px"><button class="${S.view==='list'?'on':''}" onclick="S.view='list';render()">${t('List')}</button><button class="${S.view==='map'?'on':''}" onclick="S.view='map';render()">${t('Map')}</button></div></div>
 <div class="chips">${CATS.map(([c])=>`<button class="chip ${S.cat===c?'on':''}" onclick="S.cat='${c}';render()">${t(c)}</button>`).join('')}</div></div>
 <div class="pad" id="lst" style="padding-top:6px">${lstHtml(rs)}</div>`}
function lst(){$('#lst').innerHTML=lstHtml(near())}
function lstHtml(rs){if(!rs.length)return'<div class="empty"><b>🔎</b>No match. Try another dish or category.</div>';
 if(S.view==='list')return rs.map(rcard).join('');
 const k=Math.cos(S.pos.lat*Math.PI/180)*111,P=rs.map(r=>({r,x:(r.lng-S.pos.lng)*k,y:(r.lat-S.pos.lat)*111})),sc=Math.max(.3,...P.map(p=>Math.max(Math.abs(p.x),Math.abs(p.y))))*1.3/S.zoom;
 const pins=P.map((p,i)=>{const on=S.selR===p.r.id;return`<g transform="translate(${150+p.x/sc*130} ${150-p.y/sc*130})" onclick="S.selR=${p.r.id};render()" style="cursor:pointer"><path d="M0 0C-12-14-12-28 0-28S12-14 0 0z" fill="${on?'#d6382f':'#1b2150'}" stroke="#fff" stroke-width="2"/><circle cy="-19" r="6.5" fill="#fff"/><text y="-15.5" text-anchor="middle" font-size="9" font-weight="700" fill="#1b2150">${i+1}</text>${on?`<text y="-34" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1b2150" stroke="#fff" stroke-width="3" paint-order="stroke">${esc(p.r.n)}</text>`:''}</g>`}).join('');
 return`<div class="map" style="position:relative"><div class="mc"><button onclick="S.zoom=Math.min(4,S.zoom*1.6);render()" aria-label="Zoom in">+</button><button onclick="S.zoom=Math.max(.6,S.zoom/1.6);render()" aria-label="Zoom out">−</button><button onclick="locate()" aria-label="Find my exact location">◎</button></div><svg viewBox="0 0 300 300" role="img" aria-label="Map of nearby restaurants"><rect width="300" height="300" fill="#ebe5d6"/><path d="M0 268Q110 228 300 282V300H0Z" fill="#a9d4ee"/><ellipse cx="238" cy="70" rx="46" ry="30" fill="#cfe5c0"/><path d="M0 92L300 66M0 212L300 236M88 0L112 300M214 0L190 300" stroke="#fff" stroke-width="8" fill="none"/><circle cx="150" cy="150" r="125" fill="#4285f4" fill-opacity=".1" stroke="#4285f4" stroke-dasharray="5 4"/>${pins}<circle cx="150" cy="150" r="${Math.max(12,Math.min(60,(S.me?S.me.acc/1000:.05)/sc*130))}" fill="#4285f4" fill-opacity=".18"/><circle cx="150" cy="150" r="8" fill="#4285f4" stroke="#fff" stroke-width="3"/><text x="150" y="172" text-anchor="middle" font-size="9" font-weight="700" fill="#1b2150">You</text></svg></div><div class="loc"><span>📍 ${S.me?S.me.lat.toFixed(5)+', '+S.me.lng.toFixed(5)+' · ±'+S.me.acc+' m':'Demo location: Shinjuku, Tokyo'}${S.me&&!S.pos.real?' (you are outside Japan, so the map shows Tokyo)':''}</span><span>Radius ≈ ${(sc*125/130).toFixed(1)} km</span></div>${rcard(rs.find(r=>r.id===S.selR)||rs[0])}`}

function menu(){const r=R.find(x=>x.id===S.rid),n=cartN(),ds=r.m.map((d,i)=>[d,i]).filter(([d])=>S.tab==='All'||(S.tab==='Veg'?!nonveg(d[4]):nonveg(d[4]))).sort((a,b)=>fit(b[0][4])-fit(a[0][4]));
 return`<div class="ban"><button class="round" onclick="go('nearby')" aria-label="Back">←</button>${rimg(r)}</div>
 <div class="pad" style="padding-bottom:0"><div class="row sp"><h1 style="font-size:26px">${esc(r.n)}</h1><span class="star">${r.r}</span></div><div class="mu">${esc(r.c)} · ${dist(S.pos.lat,S.pos.lng,r.lat,r.lng).toFixed(1)} km</div><div class="row" style="margin-top:8px">${bdg('Takeaway',r.dl)}${bdg('Dine in',r.di)}<a class="dir" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}">Directions ↗</a></div></div>
 <div class="stick" style="margin-top:8px"><div class="chips">${['All','Veg','Non-veg'].map(x=>`<button class="chip ${S.tab===x?'on':''}" onclick="S.tab='${x}';render()">${t(x)}</button>`).join('')}<span style="flex:none;align-self:center;margin-left:auto">${dietChips().replace('class="chips"','class="chips" style="gap:6px"')}</span></div></div>
 <div class="pad" style="padding-top:0">${ds.map(([d,i])=>{const c=S.cart[i]||0;return`<div class="dish ${fit(d[4])?'':'dim'}" onclick="S.sel=${i};render()"><div class="dt"><div style="margin-bottom:4px">${tag(d[4])}</div><b>${esc(d[0])}</b><p>${esc(d[3])}</p><b style="color:var(--sa)">${yen(d[1])}</b></div><div class="dp"><div class="pic">${art(d[2])}</div>${c?`<div class="q" onclick="event.stopPropagation()"><button onclick="add(${i},-1)" aria-label="Remove one">−</button>${c}<button onclick="add(${i},1)" aria-label="Add one">+</button></div>`:`<button onclick="event.stopPropagation();add(${i},1)">${t('Add')}</button>`}</div></div>`}).join('')}</div>
 ${n?`<div class="cbar"><div><b>${n}</b> · ${yen(sub())}</div><button onclick="go('cart')">${t('View cart')}</button></div>`:''}`}
function sheet(){const r=R.find(x=>x.id===S.rid),d=r.m[S.sel],q=d[4],nv=nonveg(q);
 return`<div class="ov" onclick="S.sel=null;render()"><div class="sheet" onclick="event.stopPropagation()" role="dialog" aria-label="${esc(d[0])}"><div class="ban">${art(d[2])}<button class="round" onclick="S.sel=null;render()" aria-label="Close">✕</button></div>
 <div class="pad" style="padding-bottom:0"><div style="margin-bottom:6px">${tag(q)}</div><h2 style="font-size:24px">${esc(d[0])}</h2><b style="color:var(--sa)">${yen(d[1])}</b><p class="mu" style="margin:4px 0 0">${esc(d[3])}</p></div>
 <div class="sum ${nv?'n':'v'}">${summary(q)}</div>
 <div class="al"><h3>${t('Dietary details')}</h3>${Q.map((x,i)=>{const y=q[i],cl=i<4?(y?'bad':'ok'):(y?'ok':'nu');return`<div class="ar"><span class="ic ${cl}">${QI[i]}</span><span class="l">${t(x)}</span><b class="${cl}">${y?t('Yes'):t('No')}</b></div>`}).join('')}</div>
 <div class="pad" style="padding-top:4px"><button style="width:100%" onclick="add(${S.sel},1);S.sel=null;render();toast('Added to cart')">${t('Add to cart')} · ${yen(d[1])}</button></div></div></div>`}
const cartN=()=>Object.entries(S.cart).reduce((s,[k,v])=>k==='rid'?s:s+v,0),cur=()=>R.find(r=>r.id===S.rid);
const sub=()=>Object.entries(S.cart).reduce((s,[k,v])=>k==='rid'?s:s+cur().m[k][1]*v,0);
function add(i,d){S.cart[i]=Math.max(0,(S.cart[i]||0)+d);render()}
function T(){const s=sub(),d=S.coupon?s*.1:0,f=S.mode==='delivery'?300:0;return{s,d,f,t:s-d+f}}
function cart(){const items=Object.entries(S.cart).filter(([k,v])=>k!=='rid'&&v>0);
 if(!items.length)return`<div class="empty"><b>🛒</b>Your cart is empty.<br><br><button onclick="go('nearby')">Find food</button></div>`;
 const r=cur(),X=T(),warn=items.filter(([k])=>nonveg(r.m[k][4])).map(([k])=>r.m[k][0]);
 return`<div class="pad"><h1 style="font-size:26px;margin-bottom:12px">${t('Cart')} · ${esc(r.n)}</h1>${modeSeg()}<div class="card" style="margin-top:12px">${items.map(([k,v])=>{const d=r.m[k];return`<div class="line"><span>${tag(d[4])} ${esc(d[0])}</span><span class="row" style="flex-wrap:nowrap"><button class="g s" onclick="add(${k},-1)" aria-label="Remove one">−</button><b>${v}</b><button class="s" onclick="add(${k},1)" aria-label="Add one">+</button></span></div>`}).join('')}</div>
 ${warn.length?`<div class="card" style="border-color:var(--vm)"><b style="color:var(--vm)">Check before you pay</b><div class="mu">Not vegetarian as served: ${warn.map(esc).join(', ')}.</div></div>`:''}
 <div class="card"><div class="row sp"><div><b>🎟️ SAKURA10</b><div class="mu">10% off your food total</div></div>${S.coupon?'<span class="tag v">Applied</span>':`<button class="s" onclick="S.coupon=1;render();toast('10% off applied')">${t('Apply')}</button>`}</div>
 <div style="margin-top:10px"><div class="line"><span>${t('Subtotal')}</span><span>${yen(X.s)}</span></div>${S.coupon?`<div class="line" style="color:var(--gr)"><span>Coupon (10%)</span><span>−${yen(X.d)}</span></div>`:''}${X.f?`<div class="line"><span>Delivery fee</span><span>${yen(X.f)}</span></div>`:''}<div class="line tot"><span>${t('Total')}</span><span>${yen(X.t)}</span></div></div></div>
 <div class="card">${S.mode==='delivery'?`<div class="f" style="margin-top:0"><label for="ad">Delivery address (hotel name, room number)</label><textarea id="ad" rows="2" placeholder="Hotel Gracery, Room 512, Shinjuku"></textarea></div>`:`<div class="row" style="flex-wrap:nowrap"><div class="f" style="flex:1;margin-top:0"><label for="tm">Arrival time</label><select id="tm">${['18:00','18:30','19:00','19:30','20:00','20:30'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="f" style="flex:1;margin-top:0"><label for="pt">Guests</label><select id="pt">${[1,2,3,4,5,6].map(x=>`<option>${x}</option>`).join('')}</select></div></div>`}
 <div class="f"><label>Payment</label><div class="pay"><label><input type="radio" name="pm" value="Card" checked> 💳 Card</label><label><input type="radio" name="pm" value="Apple / Google Pay"> 📱 Apple / Google Pay</label>${S.mode==='dine'?'<label><input type="radio" name="pm" value="Pay at restaurant"> 🏪 Pay at restaurant</label>':''}</div></div></div>
 <button style="width:100%;padding:15px;position:sticky;bottom:10px" onclick="pay()">Pay ${yen(X.t)}</button></div>`}
function pay(){if(S.mode==='delivery'&&!$('#ad').value.trim())return toast('Enter your delivery address');const X=T(),r=cur();
 S.orders.unshift({id:'TB'+Math.floor(Math.random()*9e4+1e4),rn:r.n,items:Object.entries(S.cart).filter(([k,v])=>k!=='rid'&&v>0).map(([k,v])=>v+'× '+r.m[k][0]),t:X.t,saved:X.d,pm:document.querySelector('[name=pm]:checked').value,mode:S.mode,where:S.mode==='delivery'?$('#ad').value.trim():'Table for '+$('#pt').value+' at '+$('#tm').value});
 S.cart={};S.coupon=0;go('orders');toast(S.mode==='delivery'?'Order placed':'Table booked')}
function orders(){return`<div class="pad"><h1 style="font-size:26px;margin-bottom:12px">${t('Orders')}</h1>${S.orders.length?S.orders.map(o=>`<div class="card"><div class="row sp"><h3>${esc(o.rn)}</h3><span class="tag v">${o.mode==='delivery'?'Confirmed':'Booked'}</span></div><div class="mu">#${o.id} · ${esc(o.where)}</div><div class="steps"><i class="on"></i><i></i><i></i></div><div>${o.items.map(esc).join(', ')}</div><div class="row sp" style="margin-top:6px"><span class="mu">${esc(o.pm)}${o.saved?' · saved '+yen(o.saved):''}</span><b>${yen(o.t)}</b></div></div>`).join('')+'<p class="mu" style="text-align:center">Demo only: no real payment was taken.</p>':'<div class="empty"><b>🧾</b>No orders yet.</div>'}</div>`}
function render(){const P={login,home,nearby,menu,cart,orders};const sc=$('#scr'),y=sc.scrollTop;sc.innerHTML=P[S.page]();sc.scrollTop=S.k?y:y;S.k=0;
 $('#ov').innerHTML=S.sel!==null&&S.page==='menu'?sheet():'';
 const n=cartN();$('#nav').style.display=S.page==='login'?'none':'grid';
 $('#nav').innerHTML=[['home','🏠','Home'],['nearby','🧭','Nearby'],['cart','🛒','Cart'],['orders','🧾','Orders']].map(([k,i,l])=>`<button class="${S.page===k||(k==='nearby'&&S.page==='menu')?'on':''}" onclick="go('${k}')"><b>${i}</b>${t(l)}${k==='cart'&&n?`<i>${n}</i>`:''}</button>`).join('')}
render();
</script></body></html>
