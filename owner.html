 <div class="g2"><div class="cd"><div class="ch"><h3>Opening hours</h3></div><div class="pd">${days.map((d,i)=>`<div class="row" style="padding:5px 0"><span style="width:92px">${d}</span><label class="sw"><input type="checkbox" ${i!==2?'checked':''} aria-label="${d} open"><i></i></label><input class="in" type="time" value="11:30" style="width:110px"><span>–</span><input class="in" type="time" value="22:00" style="width:110px"></div>`).join('')}</div></div>
 <div><div class="cd"><div class="ch"><h3>Ordering</h3></div><div class="pd"><div class="row" style="justify-content:space-between;margin-bottom:10px"><span>Accepting orders</span><label class="sw"><input type="checkbox" ${S.open?'checked':''} onchange="S.open^=1;render()" aria-label="Accepting orders"><i></i></label></div><div class="fm"><div><label>Delivery radius</label><select class="in"><option>2 km</option><option selected>3 km</option><option>5 km</option></select></div><div><label>Prep time</label><select class="in"><option>15 min</option><option selected>25 min</option><option>35 min</option></select></div></div></div></div>

const PAGES={overview,orders,reservations,menu,analytics,reviews,settings};
const KJ={overview:'概況',orders:'注文',reservations:'予約',menu:'献立',analytics:'分析',reviews:'評価',settings:'設定'};
function render(){if(S.out)return $('#root').innerHTML=`<div class="out"><div><h1 style="font-size:22px">You’ve signed out</h1><p class="mu">Demo session ended.</p><button class="btn p" onclick="S.out=0;render()">Sign in again</button></div></div>`;
 const act_=ORD.filter(o=>['New','Preparing','Ready'].includes(o.st)).length,pen=RES.filter(r=>r.st==='Pending').length,un=NOT.filter(n=>!n.read).length;
 const nav=[['overview','Overview','grid'],['orders','Orders','list',act_],['reservations','Reservations','cal',pen],['menu','Menu','fork'],['analytics','Analytics','chart'],['reviews','Reviews','star'],['settings','Settings','sliders']];
 $('#root').innerHTML=`<div class="app ${S.nav?'nv':''}"><div class="scrim" onclick="S.nav=0;render()"></div><aside><div class="brand"><span class="hk">食</span><div>Tabemasu<small>パートナー · Partner</small></div></div>

 ${nav.map(n=>`<button class="ni ${S.page===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span><small>${KJ[n[0]]}</small>${n[3]?`<span class="b">${n[3]}</span>`:''}</button>`).join('')}<div class="sp"></div><button class="ni" onclick="S.modal='help';render()">Help and support</button></aside>
 <div class="col"><header><button class="ib hm" onclick="S.nav=1;render()" aria-label="Menu">${ic('menu')}</button><div class="hs"><input placeholder="Search orders, customers, dishes" aria-label="Search" onkeydown="if(event.key==='Enter'){S.q=this.value;S.page='orders';S.view='list';render()}"></div><div class="sp"></div>
 <label class="row sm" style="gap:8px"><span class="mu">${S.open?'Open for orders':'Paused'}</span><span class="sw"><input type="checkbox" ${S.open?'checked':''} onchange="S.open^=1;toast(S.open?'You are now accepting orders':'New orders paused');render()" aria-label="Open for orders"><i></i></span></label>
 <div class="dd"><button class="ib" onclick="S.notif^=1;S.user=0;render()" aria-label="Notifications">Notices${un?`<i>${un}</i>`:''}</button>${S.notif?`<div class="dm"><div class="ch"><b>Notifications</b><button class="btn sm" onclick="NOT.forEach(n=>n.read=1);render()">Mark all read</button></div>${NOT.map((n,i)=>`<button class="it" onclick="NOT[${i}].read=1;S.notif=0;go('${i<2?'orders':i==2?'reviews':'settings'}')"><div style="font-weight:${n.read?400:600}">${esc(n.t)}</div><div class="mu sm">${n.m}</div></button>`).join('')}</div>`:''}</div>
 <div class="dd"><button class="ib" style="width:auto;padding:0 4px" onclick="S.user^=1;S.notif=0;render()" aria-label="Account">Haruka M. ▾</button>${S.user?`<div class="dm" style="width:220px"><div class="it"><b>Haruka Mori</b><div class="mu sm">Owner · haruka@sakura-shojin.example</div></div><button class="it" onclick="S.user=0;go('settings')">Restaurant settings</button><button class="it" onclick="S.user=0;S.modal='help';render()">Help and support</button><button class="it" onclick="S.out=1;S.user=0;render()">Sign out</button></div>`:''}</div></header>
 ${S.open?'':'<div class="banner">New orders are paused. Customers can see your menu but cannot order. <button class="btn sm" onclick="S.open=1;render()">Resume orders</button></div>'}<main>${PAGES[S.page]()}</main></div></div>${S.drawer?drawer():''}${S.modal==='help'?`<div class="ov" onclick="S.modal=null;render()"></div><div class="md"><h2 style="font-size:18px">Help and support</h2><p class="mu">Partner support is available 10:00–22:00 JST.</p><p>Email partners@tabemasu.example<br>Phone +81 3-5555-0100</p><p class="mu sm">Demo contact details.</p><button class="btn p" onclick="S.modal=null;render()">Close</button></div>`:S.modal?modal():''}`}
document.addEventListener('click',e=>{if((S.notif||S.user)&&!e.target.closest('.dd')){S.notif=S.user=0;render()}});
render();
</script></body></html>
